[project]
name = "evidentia-worker"
version = "0.1.0"
description = "Evidentia async workers (Celery): ingestion, metadata, dedup, AI enrichment"
requires-python = ">=3.12"
dependencies = [
    "evidentia-core",
    "evidentia-cloudinary",
    "evidentia-ai",
    "evidentia-ml",
    "evidentia-reporting",
    "celery[redis]>=5.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidentia_worker"]
