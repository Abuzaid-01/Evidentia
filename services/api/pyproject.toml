[project]
name = "evidentia-api"
version = "0.1.0"
description = "Evidentia REST API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "evidentia-core",
    "evidentia-cloudinary",
    "evidentia-ai",
    "evidentia-ml",
    "evidentia-reporting",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[project.scripts]
evidentia-export-openapi = "evidentia_api.openapi_export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidentia_api"]
