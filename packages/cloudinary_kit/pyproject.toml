[project]
name = "evidentia-cloudinary"
version = "0.1.0"
description = "Cloudinary integration kit: signed uploads, webhooks, delivery, Admin + Analyze APIs, bootstrap"
requires-python = ">=3.12"
dependencies = [
    "cloudinary>=1.41",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidentia_cloudinary"]
