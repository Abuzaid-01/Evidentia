[project]
name = "evidentia-core"
version = "0.1.0"
description = "Shared domain model, settings, database and events for Evidentia"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.16",
    "pgvector>=0.3",
    "alembic>=1.14",
    "structlog>=24.4",
    "redis>=5.2",
    "celery[redis]>=5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidentia_core"]
