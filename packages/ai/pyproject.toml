[project]
name = "evidentia-ai"
version = "0.1.0"
description = "Vision/LLM provider adapters (Cloudinary AI Vision, Gemini, Groq) with schema-validated outputs"
requires-python = ">=3.12"
dependencies = [
    "evidentia-core",
    "evidentia-cloudinary",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidentia_ai"]
