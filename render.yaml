services:
  - type: web
    name: evidentia-api
    runtime: python
    plan: free
    buildCommand: "pip install uv && uv sync"
    startCommand: "uv run alembic upgrade head && uv run uvicorn evidentia_api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: evidentia-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AUTH_MODE
        value: dev
      - key: EMBEDDINGS_ENABLED
        value: "false"
      - key: DEMO_MODE_ENABLED
        value: "true"

  - type: worker
    name: evidentia-worker
    runtime: python
    plan: free
    buildCommand: "pip install uv && uv sync"
    startCommand: "uv run celery -A evidentia_worker.celery_app worker -Q ingest,analysis,maintenance,reports,ml --pool=threads --concurrency=2 --loglevel=INFO"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: evidentia-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDINGS_ENABLED
        value: "false"

databases:
  - name: evidentia-db
    databaseName: evidentia
    user: evidentia
    plan: free
