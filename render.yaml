services:
  # API + Celery worker in ONE free web service: Render's free plan has no background workers.
  # infra/render/start.sh runs migrations, starts the worker (restarted if it exits) and the API.
  - type: web
    name: evidentia-api
    runtime: python
    plan: free
    buildCommand: "pip install uv && uv sync && uv run --no-sync playwright install chromium"
    startCommand: "bash infra/render/start.sh"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: evidentia-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AUTH_MODE
        value: dev
      - key: EMBEDDINGS_ENABLED
        value: "false"
      - key: DEMO_MODE_ENABLED
        value: "true"
      # Cloudinary sends upload webhooks here (no tunnel needed in production)
      - key: PUBLIC_API_BASE_URL
        value: https://evidentia-yq79.onrender.com
      # links from reports back into the app
      - key: WEB_BASE_URL
        value: https://evidentiia.netlify.app

databases:
  - name: evidentia-db
    databaseName: evidentia
    user: evidentia
    plan: free
